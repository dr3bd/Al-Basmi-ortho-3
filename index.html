    <script>
      (function () {
        const NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function SafeViteWebSocket(url, protocols) {
          const isViteHmr =
            typeof protocols === 'string'
              ? protocols.includes('vite-hmr') || protocols.includes('vite-ping')
              : Array.isArray(protocols) &&
                protocols.some((p) => String(p).includes('vite-hmr') || String(p).includes('vite-ping'));
          if (isViteHmr) {
            const dummy = new EventTarget();
            dummy.readyState = 3;
            dummy.send = function () {};
            dummy.close = function () {};
            dummy.addEventListener = EventTarget.prototype.addEventListener.bind(dummy);
            dummy.removeEventListener = EventTarget.prototype.removeEventListener.bind(dummy);
            return dummy;
          }
          return protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
        }
        SafeViteWebSocket.prototype = NativeWebSocket.prototype;
        SafeViteWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        SafeViteWebSocket.OPEN = NativeWebSocket.OPEN;
        SafeViteWebSocket.CLOSING = NativeWebSocket.CLOSING;
        SafeViteWebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket = SafeViteWebSocket;
      })();
    </script>
  </head>
